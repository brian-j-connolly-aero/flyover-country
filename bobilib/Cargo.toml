[package]
name = "bobi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exact and heuristic solvers for BOBILib bilevel instances, starting with knapsack-type interdiction"

# Its own workspace, so the game's workspace at the repository root never builds it.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
highs = "1"
highs-sys = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
