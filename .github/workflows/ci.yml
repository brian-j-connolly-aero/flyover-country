name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust core, AI and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release

  web:
    name: WebAssembly, determinism and the browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo build --release -p flyover-cli
      # Players run the engine committed in web/src/wasm, without Rust. Make
      # sure it plays exactly like the Rust source it was built from.
      - name: Committed engine matches the Rust source
        run: ./web/scripts/compare-engines.sh
      - name: Freshly built engine matches too
        run: |
          npm run wasm
          ./web/scripts/compare-engines.sh
      - run: npm run build

  balance:
    name: Balance harness (10,000 bot games, all 35 lineups)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p flyover-cli -- balance --games 10000
