name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust core, AI and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release

  web:
    name: WebAssembly, determinism and the browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - name: Same seed and orders, same state, native vs WebAssembly
        run: |
          cargo build --release -p flyover-cli
          for args in "--seed 7 --factions Pacific,FrontRange,Texas,Beehive" \
                      "--seed 123 --factions Cascadia,Dreamland,GrainBelt,Texas" \
                      "--seed 9001 --factions Beehive,Pacific,GrainBelt,Cascadia"; do
            ./target/release/flyover hashes $args > native.txt
            node web/scripts/wasm-hashes.mjs $args > wasm.txt
            diff native.txt wasm.txt
            echo "match: $args"
          done
      - run: npm run build
        working-directory: web

  balance:
    name: Balance harness (10,000 bot games, all 35 lineups)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p flyover-cli -- balance --games 10000
