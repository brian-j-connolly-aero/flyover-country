[workspace]
resolver = "2"
members = ["crates/flyover-core", "crates/flyover-ai", "crates/flyover-wasm", "crates/flyover-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
flyover-core = { path = "crates/flyover-core" }
flyover-ai = { path = "crates/flyover-ai" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.flyover-wasm]
opt-level = "s"
